<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Viajemos Juntos</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    
    <!-- Hoja de estilos personalizada -->
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="login-box p-5 shadow-lg animate__animated animate__fadeInUp">
            <h2 class="text-center mb-4">Inicio de sesion</h2>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" id="email" placeholder="Tu correo" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" placeholder="Tu contraseña" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
            </form>

            <p class="text-center mt-3">
                ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
            </p>
        </div>
    </div>
    <footer class="footer">
        <p class="mb-0">&copy; 2025 Viajemos Juntos - Desarrollado por Karen Verónica Mancilla Solarte</p>
    </footer>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
    // Manejo del formulario de inicio de sesión
    let loginForm = document.getElementById("loginForm");
    if (loginForm) {
        loginForm.addEventListener("submit", function (e) {
            e.preventDefault();

            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value;

            // Validación de campos vacíos
            if (!email || !password) {
                alert("Por favor, completa todos los campos.");
                return;
            }

            // Obtener la lista de usuarios desde LocalStorage
            let users = JSON.parse(localStorage.getItem("users")) || [];

            // Buscar el usuario en la lista
            let validUser = users.find(user => user.email === email && user.password === btoa(password));

            if (!validUser) {
                alert("Correo o contraseña incorrectos.");
                return;
            }

            alert(`Bienvenido, ${validUser.name}`);

            // Redirigir al usuario según su rol
            if (validUser.role === "admin") {
                window.location.href = "admin.html"; // Redirigir al panel de administrador
            } else if (validUser.role === "user") {
                window.location.href = "paginaprincpial.html"; // Redirigir a la página principal de usuarios regulares
            }
        });
    }
});


    </script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
