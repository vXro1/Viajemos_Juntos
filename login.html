<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Viajemos Juntos</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    
    <!-- Hoja de estilos personalizada -->
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="login-box p-5 shadow-lg animate__animated animate__fadeInUp">
            <h2 class="text-center mb-4">Inicio de sesión</h2>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" id="email" placeholder="Tu correo" required autofocus>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" placeholder="Tu contraseña" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
            </form>

            <p class="text-center mt-3">
                ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
            </p>
        </div>
    </div>

    <footer class="footer text-center mt-3">
        <p class="mb-0">&copy; 2025 Viajemos Juntos - Desarrollado por Karen Verónica Mancilla Solarte</p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            let loginForm = document.getElementById("loginForm");
            let emailInput = document.getElementById("email");

            // Enfocar automáticamente en el campo de email
            if (emailInput) {
                emailInput.focus();
            }

            if (loginForm) {
                loginForm.addEventListener("submit", function (e) {
                    e.preventDefault();

                    let email = document.getElementById("email").value.trim();
                    let password = document.getElementById("password").value;

                    // Validación de campos vacíos
                    if (!email || !password) {
                        alert("Por favor, completa todos los campos.");
                        return;
                    }

                    // Obtener la lista de usuarios desde LocalStorage
                    let users = JSON.parse(localStorage.getItem("users")) || [];

                    // Buscar el usuario en la lista
                    let validUser = users.find(user => user.email === email && user.password === btoa(password));

                    if (!validUser) {
                        alert("Correo o contraseña incorrectos.");
                        return;
                    }

                    // Guardar usuario en sessionStorage para persistencia temporal
                    sessionStorage.setItem("loggedUser", JSON.stringify(validUser));

                    alert(`Bienvenido, ${validUser.name}`);

                    // Redirigir según el rol del usuario
                    if (validUser.role === "admin") {
                        window.location.href = "admin.html";
                    } else {
                        window.location.href = "pagina_principal.html"; // Nombre corregido
                    }
                });
            }
        });
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
