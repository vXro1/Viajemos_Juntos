<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Viajemos Juntos</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

    <!-- Hoja de estilos personalizada -->
    <link rel="stylesheet" href="registro.css">
</head>

<body>
    <!-- Splash Screen -->
    <div class="splash-screen" id="splash-screen">
        <img src="https://cdn-icons-png.flaticon.com/512/684/684908.png" alt="Avión" class="plane-icon" id="plane">
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
    </div>

    <!-- Formulario de Registro -->
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="register-box p-5 shadow-lg animate__animated animate__fadeInUp">
            <h2 class="text-center mb-4">Registro</h2>

            <form id="registerForm">
                <div class="mb-3">
                    <label for="name" class="form-label">Nombre Completo</label>
                    <input type="text" class="form-control" id="name" placeholder="Tu nombre completo" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" id="email" placeholder="Tu correo electrónico" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" placeholder="Tu contraseña" required>
                </div>

                <div class="mb-3">
                    <label for="confirm-password" class="form-label">Confirmar Contraseña</label>
                    <input type="password" class="form-control" id="confirm-password" placeholder="Repite tu contraseña"
                        required>
                </div>

                <div class="mb-3">
                    <label for="admin-role" class="form-label">Rol de Usuario</label>
                    <select class="form-control" id="admin-role" required>
                        <option value="admin">Administrador</option>
                        <option value="user">Usuario Regular</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary w-100">Registrarse</button>
            </form>

            <p class="text-center mt-3">
                ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
            </p>
        </div>
    </div>

    <footer class="footer">
        <p class="mb-0">&copy; 2025 Viajemos Juntos - Desarrollado por Karen Verónica Mancilla Solarte</p>
    </footer>

    <!-- JavaScript -->
    <script >
       document.addEventListener("DOMContentLoaded", function () {
    let registerForm = document.getElementById("registerForm");
    let splashScreen = document.getElementById("splash-screen");
    let progressBar = document.getElementById("progress-bar");
    let plane = document.getElementById("plane");

    registerForm.addEventListener("submit", function (e) {
        e.preventDefault();

        let name = document.getElementById("name").value.trim();
        let email = document.getElementById("email").value.trim();
        let password = document.getElementById("password").value;
        let confirmPassword = document.getElementById("confirm-password").value;
        let role = document.getElementById("admin-role").value;

        if (!name || !email || !password || !confirmPassword || !role) {
            alert("Todos los campos son obligatorios.");
            return;
        }

        let emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
            alert("Ingrese un correo electrónico válido.");
            return;
        }

        if (password !== confirmPassword) {
            alert("Las contraseñas no coinciden.");
            return;
        }

        let users = JSON.parse(localStorage.getItem("users")) || [];
        if (users.some(user => user.email === email)) {
            alert("Este correo ya está registrado. Intenta iniciar sesión.");
            return;
        }

        let newUser = { name, email, password: btoa(password), role };
        users.push(newUser);
        localStorage.setItem("users", JSON.stringify(users));

        alert("Registro exitoso. Rol asignado: " + role);

        // Mostrar splash screen
        splashScreen.style.visibility = "visible";
        splashScreen.style.opacity = "1";

        // Iniciar animación
        progressBar.style.width = "100%";
        plane.style.left = "80%";

        // Redirigir después de la animación
        setTimeout(() => {
            window.location.href = "login.html";
        }, 3000);
    });
});

    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
