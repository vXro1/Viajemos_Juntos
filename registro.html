<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Viajemos Juntos</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    
    <!-- Hoja de estilos personalizada -->
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="register-box p-5 shadow-lg animate__animated animate__fadeInUp">
            <h2 class="text-center mb-4">🌍 Registrarse como Administrador</h2>

            <form id="registerForm">
                <div class="mb-3">
                    <label for="name" class="form-label">Nombre Completo</label>
                    <input type="text" class="form-control" id="name" placeholder="Tu nombre completo" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" id="email" placeholder="Tu correo electrónico" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" placeholder="Tu contraseña" required>
                </div>

                <div class="mb-3">
                    <label for="confirm-password" class="form-label">Confirmar Contraseña</label>
                    <input type="password" class="form-control" id="confirm-password" placeholder="Repite tu contraseña" required>
                </div>

                <!-- Campo adicional para asignar el rol de administrador -->
                <div class="mb-3">
                    <label for="admin-role" class="form-label">Rol de Usuario</label>
                    <select class="form-control" id="admin-role" required>
                        <option value="admin">Administrador</option>
                        <option value="user">Usuario Regular</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary w-100">Registrarse</button>
            </form>

            <p class="text-center mt-3">
                ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
            </p>
        </div>
    </div>
    <script>

document.addEventListener("DOMContentLoaded", function () {
    // Manejo del formulario de registro
    let registerForm = document.getElementById("registerForm");
    if (registerForm) {
        registerForm.addEventListener("submit", function (e) {
            e.preventDefault();

            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value;
            let confirmPassword = document.getElementById("confirm-password").value;
            let role = document.getElementById("admin-role").value; // Obtener el rol desde el formulario

            // Validar campos vacíos
            if (!name || !email || !password || !confirmPassword) {
                alert("Todos los campos son obligatorios.");
                return;
            }

            // Validar email con una expresión regular
            let emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert("Ingrese un correo electrónico válido.");
                return;
            }

            // Verificar que las contraseñas coincidan
            if (password !== confirmPassword) {
                alert("Las contraseñas no coinciden.");
                return;
            }

            // Obtener usuarios guardados en LocalStorage o inicializar lista vacía
            let users = JSON.parse(localStorage.getItem("users")) || [];

            // Verificar si el usuario ya está registrado
            if (users.some(user => user.email === email)) {
                alert("Este correo ya está registrado. Intenta iniciar sesión.");
                return;
            }

            // Guardar el nuevo usuario (con codificación de la contraseña)
            let newUser = { name, email, password: btoa(password), role }; // btoa() codifica en base64
            users.push(newUser);
            localStorage.setItem("users", JSON.stringify(users));

            alert("Registro exitoso. Ahora puedes iniciar sesión.");

            // Redirigir al usuario según su rol
            if (role === "admin") {
                window.location.href = "admin.html"; // Redirigir al panel de administrador
            } else {
                window.location.href = "paginaprincipal.html"; // Redirigir a la página principal
            }
        });
    }
});


    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
</body>
</html>
