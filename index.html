<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viajemos Juntos</title>

    <!-- Enlace a la hoja de estilos principal -->
    <link rel="stylesheet" href="estiloprincipal.css">
    
    <!-- Biblioteca Animate.css para animaciones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

    <!-- Enlace al archivo JavaScript con "defer" para que se cargue después del HTML -->
    <script defer src="main.js"></script>
</head>
<body>
    <!-- Contenedor principal -->
    <div class="container">
        <!-- Sección de la autora o bienvenida -->
        <div class="autora">
            <!-- Enlace que redirige a la página principal -->
            <a href="login.html">
                <!-- Texto con animación de entrada -->
                <p class="text animate__animated animate__zoomInDown">Viajemos Juntos</p>
            </a>
        </div>
    </div>
</body>
</html>
