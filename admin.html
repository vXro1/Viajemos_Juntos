<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Viajemos Juntos</title>
    <link rel="stylesheet" href="estiloadmin.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
   
</head>
<body>
    <div class="container mt-5">
        <h2>Panel de Administración</h2>
        <p>Bienvenido, administrador. Aquí puedes ver la lista de usuarios registrados.</p>

        <!-- Barra de búsqueda con ícono -->
        <div class="search-container">
            <input type="text" class="search-box" id="searchInput" placeholder="Buscar...">
            <span class="search-icon"><i class="fas fa-plane"></i></span>
            <!-- Botón de lupa -->
            <button class="btn btn-outline-secondary" id="searchButton">
                <i class="fas fa-search"></i>
            </button>
        </div>

        <!-- Tabla de usuarios -->
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Rol</th>
                </tr>
            </thead>
            <tbody id="userTable">
                <!-- Los usuarios serán cargados aquí -->
            </tbody>
        </table>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            let users = JSON.parse(localStorage.getItem("users")) || [];
            let tableBody = document.getElementById("userTable");

            // Mostrar todos los usuarios inicialmente
            displayUsers(users);

            // Función para mostrar usuarios
            function displayUsers(usersToDisplay) {
                tableBody.innerHTML = "";
                if (usersToDisplay.length === 0) {
                    tableBody.innerHTML = "<tr><td colspan='4'>No hay usuarios registrados.</td></tr>";
                } else {
                    usersToDisplay.forEach((user, index) => {
                        tableBody.innerHTML += `
                            <tr class="user-row">
                                <td>${index + 1}</td>
                                <td class="user-name">${user.name}</td>
                                <td class="user-email">${user.email}</td>
                                <td class="user-role">${user.role}</td>
                            </tr>
                        `;
                    });
                }
            }

            // Función para resaltar las coincidencias
            function highlightMatches(query) {
                let rows = document.querySelectorAll(".user-row");
                rows.forEach(row => {
                    let cells = row.querySelectorAll("td");
                    let isMatch = false;

                    cells.forEach(cell => {
                        // Limpiar el resaltado en todas las celdas
                        cell.classList.remove("highlight");

                        if (cell.textContent.toLowerCase().includes(query)) {
                            isMatch = true;
                            cell.classList.add("highlight"); // Resaltar coincidencias
                        }
                    });

                    // Mostrar solo las filas que tienen coincidencias
                    row.style.display = isMatch ? "" : "none";
                });
            }

            // Filtrar usuarios y resaltar coincidencias al escribir en el campo de búsqueda
            document.getElementById("searchInput").addEventListener("input", function() {
                let query = this.value.toLowerCase();
                highlightMatches(query);
            });

            // Agregar la funcionalidad al botón de lupa
            document.getElementById("searchButton").addEventListener("click", function() {
                let query = document.getElementById("searchInput").value.toLowerCase();
                highlightMatches(query);
            });
        });
    </script>
</body>
</html>
